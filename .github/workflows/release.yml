name: Publish Python package

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production-source:
    name: Verify final 0.3.0 production artifact
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download exact final candidate artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: 9267369583
          github-token: ${{ github.token }}
          repository: backgammonsimplified/backgammon-engine-kit
          run-id: 31961519965
          path: dist

      - name: Verify exact final production files
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/backgammon_engine_kit-0.3.0-py3-none-any.whl
          test -f dist/backgammon_engine_kit-0.3.0.tar.gz
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          printf '%s  %s\n' \
            'c75b920971c0947c41d79cbae09ae2bafda7717201798fee27fd6b1c840d05f7' \
            'dist/backgammon_engine_kit-0.3.0-py3-none-any.whl' \
            '0aff56858305c5864934cc58b1500e39952459649841f1af5d1a7d4d4a0bdefb' \
            'dist/backgammon_engine_kit-0.3.0.tar.gz' | sha256sum -c -

      - name: Hand off exact production distributions
        uses: actions/upload-artifact@v7
        with:
          name: production-0.3.0-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish exact final 0.3.0 files to PyPI
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' }}
    needs: verify-production-source
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download exact promoted distributions
        uses: actions/download-artifact@v8
        with:
          name: production-0.3.0-distributions
          path: dist

      - name: Re-verify exact final production files
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/backgammon_engine_kit-0.3.0-py3-none-any.whl
          test -f dist/backgammon_engine_kit-0.3.0.tar.gz
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          printf '%s  %s\n' \
            'c75b920971c0947c41d79cbae09ae2bafda7717201798fee27fd6b1c840d05f7' \
            'dist/backgammon_engine_kit-0.3.0-py3-none-any.whl' \
            '0aff56858305c5864934cc58b1500e39952459649841f1af5d1a7d4d4a0bdefb' \
            'dist/backgammon_engine_kit-0.3.0.tar.gz' | sha256sum -c -

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
