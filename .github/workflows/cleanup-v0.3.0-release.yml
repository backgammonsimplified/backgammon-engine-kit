name: Cleanup v0.3.0 release scaffolding

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/cleanup-v0.3.0-release.yml

permissions:
  contents: write

jobs:
  cleanup:
    name: Remove completed 0.3.0 release scaffolding
    if: ${{ startsWith(github.event.head_commit.message, 'Remove completed v0.3.0 release scaffolding') }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v0.3.0
      RELEASE_SOURCE_SHA: 5aeb87c80cf112b3a323451bb7844d88acceaea0
      WHEEL_FILE: backgammon_engine_kit-0.3.0-py3-none-any.whl
      WHEEL_SHA256: c75b920971c0947c41d79cbae09ae2bafda7717201798fee27fd6b1c840d05f7
      SDIST_FILE: backgammon_engine_kit-0.3.0.tar.gz
      SDIST_SHA256: 0aff56858305c5864934cc58b1500e39952459649841f1af5d1a7d4d4a0bdefb
    steps:
      - name: Verify public release authority before cleanup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          curl --fail-with-body -sS "${auth[@]}" "${api}/git/ref/tags/${RELEASE_TAG}" > /tmp/tag.json
          curl --fail-with-body -sS "${auth[@]}" "${api}/releases/tags/${RELEASE_TAG}" > /tmp/release.json
          python - <<'PY'
          import json
          import os
          with open('/tmp/tag.json', encoding='utf-8') as handle:
              tag = json.load(handle)
          with open('/tmp/release.json', encoding='utf-8') as handle:
              release = json.load(handle)
          assert tag['object']['sha'] == os.environ['RELEASE_SOURCE_SHA']
          assert release['tag_name'] == os.environ['RELEASE_TAG']
          assert release['draft'] is False
          assert release['prerelease'] is False
          assets = {item['name']: item.get('digest') for item in release['assets']}
          expected = {
              os.environ['WHEEL_FILE']: 'sha256:' + os.environ['WHEEL_SHA256'],
              os.environ['SDIST_FILE']: 'sha256:' + os.environ['SDIST_SHA256'],
          }
          assert assets == expected, (assets, expected)
          PY

      - name: Delete merged release branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          branches=(
            'release/trusted-publishing'
            'release/v0.3.0-github-release'
            'release/0.3.0-final-docs-candidate'
            'release/0.3.0-production-promotion'
            'verify/pypi-0.3.0-clean-install'
            'docs/public-release-polish'
            'chore/post-0.3.0-release-cleanup'
          )
          for branch in "${branches[@]}"; do
            status="$(curl -sS -o /tmp/delete-ref.json -w '%{http_code}' -X DELETE "${auth[@]}" "${api}/git/refs/heads/${branch}")"
            case "$status" in
              204|404) ;;
              *) cat /tmp/delete-ref.json >&2; exit 1 ;;
            esac
          done
          for branch in "${branches[@]}"; do
            status="$(curl -sS -o /tmp/get-ref.json -w '%{http_code}' "${auth[@]}" "${api}/git/ref/heads/${branch}")"
            test "$status" = "404"
          done

      - name: Remove this one-shot cleanup workflow from master
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          path='.github/workflows/cleanup-v0.3.0-release.yml'
          curl --fail-with-body -sS "${auth[@]}" "${api}/contents/${path}?ref=master" > /tmp/workflow.json
          python - <<'PY' > /tmp/delete-workflow.json
          import json
          with open('/tmp/workflow.json', encoding='utf-8') as handle:
              current = json.load(handle)
          print(json.dumps({
              'message': 'Remove completed one-shot v0.3.0 cleanup workflow',
              'sha': current['sha'],
              'branch': 'master',
          }))
          PY
          curl --fail-with-body -sS -X DELETE "${auth[@]}" "${api}/contents/${path}" --data-binary @/tmp/delete-workflow.json > /tmp/delete-workflow-response.json
          status="$(curl -sS -o /tmp/workflow-after.json -w '%{http_code}' "${auth[@]}" "${api}/contents/${path}?ref=master")"
          test "$status" = "404"
