[metadata]
name = backgammon-engine-kit
version = 0.3.0
description = Evidence-backed engine-neutral contracts for backgammon position analysis
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.7
include_package_data = False
install_requires =
    jsonschema>=4.17,<5

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    backgammon-engine-kit = backgammon_engine_kit.cli:main

[options.package_data]
backgammon_engine_kit.position_contract =
    schemas/*.json
