name: Publish Python package

on:
  pull_request:
    paths:
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  build:
    name: Build and validate final 0.3.0 candidate
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact final 0.3.0 source commit
        uses: actions/checkout@v6
        with:
          ref: 5aeb87c80cf112b3a323451bb7844d88acceaea0
          persist-credentials: false

      - name: Verify exact release commit
        shell: bash
        run: |
          set -euo pipefail
          expected="5aeb87c80cf112b3a323451bb7844d88acceaea0"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install release tooling and test dependencies
        run: python -m pip install --upgrade pip build twine pytest

      - name: Install package and run full tests
        run: |
          python -m pip install .
          python -m pytest -q

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate distribution metadata and README rendering
        run: python -m twine check dist/*

      - name: Smoke-test built wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .release-wheel
          .release-wheel/bin/python -m pip install --upgrade pip
          .release-wheel/bin/python -m pip install dist/*.whl
          .release-wheel/bin/python -m pip check
          .release-wheel/bin/python -c 'import backgammon_engine_kit as b; assert b.__version__ == "0.3.0"'

      - name: Smoke-test built sdist
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .release-sdist
          .release-sdist/bin/python -m pip install --upgrade pip
          .release-sdist/bin/python -m pip install dist/*.tar.gz
          .release-sdist/bin/python -m pip check
          .release-sdist/bin/python -c 'import backgammon_engine_kit as b; assert b.__version__ == "0.3.0"'

      - name: Record exact final artifact hashes
        shell: bash
        run: sha256sum dist/*

      - name: Upload exact final candidate distributions
        uses: actions/upload-artifact@v7
        with:
          name: final-0.3.0-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30
